<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clone Team Rooms — motion</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0c1322; --navy:#12306e; --blue:#1d8cf0; --muted:#8a8f98; --line:#e8eaee; --ok:#12a37f; --warn:#d98a00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #f6f9fe 62%, #e9f1fd 100%); }
  #stage::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(#c9d8f2 1px, transparent 1.2px); background-size: 14px 14px; opacity: .55;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 110%, #000 0%, transparent 70%), radial-gradient(ellipse 40% 30% at 0% 0%, #000 0%, transparent 70%); -webkit-mask-composite: source-over; }
  #tint { position: absolute; inset: 0; background: linear-gradient(180deg, #eaf2ff, #dbe8fd); opacity: 0; }
  .abs { position: absolute; }
  .hl { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; color: var(--ink); white-space: nowrap; }
  .hl .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  .hl b { color: var(--blue); font-weight: 800; }
  .hl.navy { color: var(--navy); }
  .card { position: absolute; background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(20,50,110,.10); }
  .glow { box-shadow: 0 0 0 1.5px #8cc6fb, 0 0 0 6px rgba(29,140,240,.10), 0 18px 50px rgba(29,140,240,.18); }
  .av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; flex: none; position: relative; width: 44px; height: 44px; font-size: 18px; }
  .av.clone { background: #fff; color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
  .av.clone::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px dashed var(--c); opacity: .55; }
  .av.s { width: 26px; height: 26px; font-size: 12px; } .av.s.clone::after { inset: -3.5px; border-width: 1.5px; } .av.s.clone { box-shadow: inset 0 0 0 1.5px var(--c); }
  .av.l { width: 76px; height: 76px; font-size: 30px; }
  .livedot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #fff; }
  .cur { position: absolute; z-index: 20; }
  .cur .tag { position: absolute; left: 16px; top: 19px; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .comp { padding: 18px 20px 14px; }
  .comp .txt { font-size: 19px; min-height: 28px; line-height: 28px; white-space: nowrap; }
  .comp .txt .mention { color: var(--blue); font-weight: 500; }
  .comp .foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; color: #3c414a; }
  .comp .foot .sp { flex: 1; }
  .tog { width: 30px; height: 17px; border-radius: 999px; background: #d9dce1; position: relative; display: inline-block; }
  .tog i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .sendb { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--blue); vertical-align: -4px; margin-left: 1px; }
  .tabchip { display: inline-block; font-size: 11px; font-weight: 600; color: var(--blue); border: 1px solid #b8dcfb; border-radius: 6px; padding: 0 6px; margin-left: 10px; line-height: 18px; vertical-align: 2px; }
  .bubble { position: absolute; background: #f1f3f6; border-radius: 20px; padding: 12px 18px; font-size: 18px; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .who .note { font-weight: 400; color: var(--muted); font-size: 13.5px; }
  .pill { display: inline-block; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: #e3f6ef; } .pill.wait { color: var(--warn); background: #fdf2dc; } .pill.blue { color: var(--blue); background: #e6f2fe; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  .prop { padding: 22px 26px; width: 640px; }
  .prop .pt { font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
  .prop .row { display: grid; grid-template-columns: 26px 178px 1fr 86px; align-items: center; gap: 12px; margin-top: 14px; font-size: 15px; }
  .prop .bar { height: 7px; border-radius: 4px; background: #eef0f3; overflow: hidden; }
  .prop .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--ok); }
  .prop .bar i.amber { background: var(--warn); }
  .prop .vv { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .prop .why { grid-column: 2 / -1; color: var(--muted); font-size: 13px; margin-top: -8px; }
  .btn { display: inline-block; font-weight: 600; font-size: 14.5px; border-radius: 10px; padding: 8px 18px; background: var(--ink); color: #fff; }
  .btn.g { background: #f1f3f6; color: var(--ink); }
  .key { position: absolute; bottom: 34px; width: 74px; height: 62px; border-radius: 12px; background: linear-gradient(180deg, #f3f9ff, #dcecfd); box-shadow: 0 0 0 1.5px #a9d2fb, 0 5px 0 #a9d2fb, 0 12px 22px rgba(29,140,240,.18); color: var(--blue); font-size: 13px; font-weight: 600; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .toast { position: absolute; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 18px; font-size: 15px; display: flex; gap: 10px; align-items: center; white-space: nowrap; box-shadow: 0 16px 40px rgba(12,19,34,.25); }
  .toast .av.clone { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; } .toast .av.clone::after { border-color: #fff; }
  .mini { width: 250px; padding: 14px 16px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .big { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -.05em; font-size: 190px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .big b { color: var(--blue); }
  .wm { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.03em; background: linear-gradient(90deg, #0c1322 10%, #1d6fd8 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chev { font-family: 'Plus Jakarta Sans'; font-weight: 800; letter-spacing: -.18em; background: linear-gradient(90deg, #0c1322, #1d8cf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; color: #5b6472; font-size: 21px; font-weight: 500; }
  .mascot { position: absolute; display: grid; grid-template-columns: repeat(13, 1fr); }
  .mascot i { aspect-ratio: 1; } .mascot i.b { background: var(--blue); } .mascot i.e { background: #0c1322; }
  .ring { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--ok); opacity: 0; }
</style>
</head>
<body>
<div id="stage"><div id="tint"></div></div>
<script>
const stage = document.getElementById('stage');
const anims = [], hooks = [];
const E = 'cubic-bezier(.2,.8,.2,1)', EIO = 'cubic-bezier(.65,0,.35,1)';
function A(el, kf, start, dur, opt = {}) {
  const a = el.animate(kf, { delay: start * 1000, duration: dur * 1000, fill: opt.fill || 'both', easing: opt.easing || E });
  a.pause(); anims.push(a); return a;
}
function add(html, style = {}, cls = 'abs') {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html; Object.assign(d.style, style); stage.appendChild(d); return d;
}
const FX = {
  up: [{ opacity: 0, transform: 'translateY(26px) scale(.98)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
  pop: [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1.08)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }],
  fade: [{ opacity: 0 }, { opacity: 1 }],
  right: [{ opacity: 0, transform: 'translateX(40px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
};
// show el from tIn to tOut
function show(el, tIn, tOut, fx = 'up', dIn = .7) {
  A(el, FX[fx], tIn, dIn);
  if (tOut != null) A(el, [{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-18px) scale(.985)', filter: 'blur(10px)' }], tOut, .45, { fill: 'forwards', easing: 'ease-in' });
  return el;
}
function headline(html, top, size, tIn, tOut, cls = '') {
  const el = add('', { top: top + 'px', fontSize: size + 'px' }, 'hl ' + cls);
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  let i = 0;
  tmp.childNodes.forEach((n) => {
    const blue = n.nodeType === 1;
    n.textContent.split(/(\s+)/).forEach((tok) => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { el.appendChild(document.createTextNode(' ')); return; }
      const s = document.createElement(blue ? 'b' : 'span'); s.className = 'w'; s.textContent = tok; el.appendChild(s);
      A(s, [{ opacity: 0, transform: 'translateY(22px)', filter: 'blur(12px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], tIn + i * .09, .6);
      i++;
    });
  });
  if (tOut != null) A(el, [{ opacity: 1, filter: 'blur(0)', transform: 'none' }, { opacity: 0, filter: 'blur(12px)', transform: 'translateY(-14px)' }], tOut, .4, { fill: 'forwards', easing: 'ease-in' });
  return el;
}
const av = (n, c, cls = '') => `<span class="av ${cls}" style="--c:${c}">${n}</span>`;
const C = { M: '#2f6bff', J: '#12a37f', S: '#e5484d' };
const cursorSvg = (c) => `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 2l15 9.5-6.6 1.4L16 20l-2.8 1.3-3.6-7.2L4 18.5z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function cursor(name, color, pts, tIn, tOut) { // pts: [[t,x,y],...]
  const el = add(cursorSvg(color) + (name ? `<span class="tag" style="background:${color}">${name}</span>` : ''), {}, 'cur');
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  A(el, pts.map(([t, x, y]) => ({ left: x + 'px', top: y + 'px', offset: (t - t0) / (t1 - t0), easing: EIO })), t0, t1 - t0, { easing: 'linear' });
  A(el, FX.fade, tIn, .3); A(el, [{ opacity: 1 }, { opacity: 0 }], tOut, .3, { fill: 'forwards' });
  return el;
}
function typer(el, text, start, cps, render = (s) => s) { hooks.push((t) => { const n = Math.max(0, Math.min(text.length, Math.floor((t - start) * cps))); el.innerHTML = render(text.slice(0, n)); }); }
const mention = (s) => s.replace(/&/g, '&amp;').replace(/@(\w*)/, '<span class="mention">@$1</span>');
function composer(x, y, w, body, foot = {}) {
  return add(`<div class="txt">${body}</div><div class="foot"><span style="font-size:20px;color:#5b6472">+</span><b style="font-weight:600">Clone Min</b><span class="tog"><i></i></span><span class="sp"></span><span>» GPT-6 Astra ⌄</span><span style="color:#8a8f98">Extra High ⌄</span><span class="sendb">↑</span></div>`, { left: x + 'px', top: y + 'px', width: w + 'px' }, 'card comp');
}
function mascot(x, y, px) {
  const m = ['....bbbbb....', '..bbbbbbbbb..', '.bbbbbbbbbbb.', '.bbebbbbbebb.', 'bbbebbbbbebbb', 'bbbbbbbbbbbbb', '.bbbbbbbbbbb.', '..bbbbbbbbb..', '...bb...bb...'];
  return add(m.join('').split('').map((c) => `<i class="${c === 'b' ? 'b' : c === 'e' ? 'e' : ''}"></i>`).join(''), { left: x + 'px', top: y + 'px', width: px * 13 + 'px' }, 'mascot');
}

// ───────── S1  0–4.3  AI is single-player.
headline('AI is <b>single-player.</b>', 232, 84, .35, 4.2);
[['M', C.M, 150, 430, -60], ['J', C.J, 515, 452, 0], ['S', C.S, 880, 430, 60]].forEach(([n, c, x, y, dx], i) => {
  const el = add(`${av(n, c, 's')}<span>Ask anything</span><span style="flex:1"></span><span class="sendb" style="width:24px;height:24px;font-size:12px;background:#c9cdd4">↑</span>`, { left: x + 'px', top: y + 'px' }, 'card mini');
  show(el, 1.2 + i * .18, 4.1);
  A(el, [{ translate: '0 0' }, { translate: `${dx}px 14px` }], 1.9, 2.6, { easing: 'ease-out', fill: 'both' });
});
// ───────── S2  4.5–8.2  Your team isn't.
headline('Your team <b>isn’t.</b>', 220, 96, 4.55, 8.1);
[['M', C.M, 330, 0], ['J', C.J, 602, 1], ['S', C.S, 874, 2]].forEach(([n, c, x, i]) => {
  const el = add(av(n, c, 'l'), { left: x + 'px', top: '400px' });
  show(el, 5.2 + i * .12, 8.0, 'pop', .5);
  A(el, [{ translate: '0 0' }, { translate: `${(602 - x) * .72}px 0` }], 5.9, 1.1, { easing: EIO });
});
// ───────── S3  8.4–12.5  logo
{
  const logo = add(`<span class="chev" style="font-size:120px">»</span><span class="wm" style="font-size:150px;margin-left:26px">clone</span>`, { left: 0, right: 0, top: '170px', textAlign: 'center', whiteSpace: 'nowrap' });
  show(logo, 8.45, 12.4);
  const p = add(`<span class="pill blue" style="font-size:16px;padding:8px 18px">Team Rooms</span>`, { left: 0, right: 0, top: '372px', textAlign: 'center' }); show(p, 9.1, 12.4, 'pop', .5);
  const s = add('Multiplayer AI for your whole team', { top: '432px' }, 'sub'); show(s, 9.5, 12.4);
  const m = mascot(596, 520, 7); show(m, 9.9, 12.4, 'pop', .5);
  A(m, [{ translate: '0 0' }, { translate: '0 -22px' }, { translate: '0 0' }, { translate: '0 -12px' }, { translate: '0 0' }], 10.4, 1.3, { easing: 'ease-in-out' });
}
// ───────── S4  12.7–23  Everyone's in the room / even when away
headline('Everyone’s in <b>the room.</b>', 70, 64, 12.75, 17.6);
headline('Even when they’re <b>away.</b>', 70, 64, 17.9, 22.9);
{
  const room = add(`<div style="display:flex;align-items:center;gap:12px"><span style="font-size:12px;color:#b3b8c0;letter-spacing:.08em">G-118</span><span style="flex:1"></span></div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px">Launch Room</div>
    <div style="color:#5b6472;font-size:16px;margin-top:8px;line-height:1.5">Launch Clone Team Rooms at c0mpiled Taipei tonight<br/>and sign 3 design-partner teams this week.</div>
    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px;color:#5b6472;font-size:15px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;border:2px solid var(--blue)"></span>In progress · one goal, one AI, the whole team</div>`,
    { left: '250px', top: '210px', width: '780px', padding: '30px 34px 28px' }, 'card');
  show(room, 13.2, 22.8);
  const mk = (n, c, x, t, clone) => { const el = add(`${av(n, c, clone ? 'clone' : '')}${clone ? '' : '<span class="livedot"></span>'}`, { left: x + 'px', top: '232px' }); show(el, t, clone ? 22.8 : null, 'pop', .5); return el; };
  const a1 = mk('M', C.M, 842, 14.0); const a2 = mk('J', C.J, 896, 14.9); const a3 = mk('S', C.S, 950, 15.8);
  [a1, a2].forEach((el) => A(el, [{ opacity: 1 }, { opacity: 0, filter: 'blur(10px)' }], 22.8, .45, { fill: 'forwards' }));
  A(a3, [{ opacity: 1 }, { opacity: 0 }], 18.5, .35, { fill: 'forwards' });
  mk('S', C.S, 950, 18.5, true);
  const tag = add(`<span class="pill" style="background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(20,50,110,.12);color:var(--ink);font-size:14px;padding:8px 14px"><b style="color:${C.S}">Clone Sara</b> · standing in</span>`, { left: '882px', top: '292px' });
  show(tag, 19.0, 22.8, 'pop', .45);
  cursor('Min', C.M, [[14.3, 420, 520], [16, 560, 372], [18, 470, 430], [20.2, 640, 300], [22.6, 600, 330]], 14.3, 22.7);
  cursor('Jun', C.J, [[15.2, 1100, 560], [16.6, 850, 400], [18.4, 930, 330], [20.6, 780, 420], [22.6, 820, 390]], 15.2, 22.7);
}
// ───────── S5  23.2–35.6  Ask anyone. Their Clone answers.
headline('Ask anyone. <b>Their Clone</b> answers.', 62, 60, 23.25, 35.4);
{
  const Q = '@Sara should tonight’s demo open with a purple gradient hero?';
  const c = composer(280, 300, 720, '<span id="t5"></span><span class="caret"></span>'); c.classList.add('glow'); c.style.scale = '1.2'; c.style.transformOrigin = '50% 0';
  show(c, 23.8, null); typer(c.querySelector('#t5'), Q, 24.5, 22, mention);
  A(c, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(40px) scale(.96)', filter: 'blur(8px)' }], 28.0, .45, { fill: 'forwards', easing: 'ease-in' });
  const b = add(mention(Q), { right: '200px', top: '186px' }, 'bubble'); show(b, 28.15, 35.3);
  const r = add(`<div class="who">${av('S', C.S, 's clone')}Clone Sara<span class="note">on behalf of Sara · 96% sure</span></div>
    <div style="font-size:19px;line-height:1.5;margin-top:12px;border-left:2px dashed #d5d9df;padding-left:16px;margin-left:12px">I’d open with the product itself and show value<br/>in under 30 seconds; skip the purple gradient.</div>`,
    { left: '250px', top: '290px', width: '640px', padding: '22px 26px', scale: '1.18', transformOrigin: '0 0' }, 'card');
  show(r, 29.4, 35.3);
  const th = add(`<span style="color:#8a8f98;font-size:15px">Team AI is consulting 3 Clones…</span>`, { left: '262px', top: '262px' }); show(th, 28.5, 29.3, 'fade', .3);
  const w = add('Sara is away. Her Clone answers the way she would.', { top: '548px' }, 'sub'); show(w, 30.6, 35.3);
}
// ───────── S6  35.8–46.6  Clone knows what's next.
headline('Clone knows <b>what’s next.</b>', 150, 64, 35.85, 46.4, 'navy');
{
  const P = 'Let’s open with the real product and show its value in the first 30 seconds.';
  const c = composer(240, 300, 800, `<span id="g6" style="color:#a5abb5">${P}</span><span class="tabchip" id="tc6">Tab</span>`);
  c.style.scale = '1.2'; c.style.transformOrigin = '50% 0'; show(c, 36.5, 46.3);
  A(c.querySelector('#g6'), [{ color: '#a5abb5' }, { color: '#0c1322' }], 39.6, .25);
  A(c.querySelector('#tc6'), [{ opacity: 1 }, { opacity: 0 }], 39.6, .2, { fill: 'forwards' });
  A(c, [{ boxShadow: '0 0 0 1px #e8eaee, 0 18px 50px rgba(20,50,110,.10)' }, { boxShadow: '0 0 0 1.5px #8cc6fb, 0 0 0 7px rgba(29,140,240,.12), 0 18px 50px rgba(29,140,240,.22)' }], 40.45, .35);
  A(c.querySelector('.tog'), [{ background: '#d9dce1' }, { background: '#1d8cf0' }], 40.45, .25);
  A(c.querySelector('.tog i'), [{ left: '2px' }, { left: '15px' }], 40.45, .25);
  const wk = add(`<span style="color:var(--blue);font-weight:600;font-size:15px">● Clone Min is working…</span>`, { left: '164px', top: '262px' }); show(wk, 40.7, 46.3, 'fade', .3);
  [[39.6, 60], [40.45, 146]].forEach(([t, x]) => {
    const k = add('<span>→</span><span>tab</span>', { left: x + 'px' }, 'key'); show(k, t - .25, 42.2, 'pop', .3);
    A(k, [{ translate: '0 0' }, { translate: '0 5px' }, { translate: '0 0' }], t, .3, { easing: 'ease-out' });
  });
  const s = add('It predicts your next prompt. Tab, Tab, and it’s sent.', { top: '480px' }, 'sub'); show(s, 41.2, 46.3);
}
// ───────── S7  46.8–58.6  Every Clone votes for its human.
headline('Every Clone votes for <b>its human.</b>', 62, 60, 46.85, 53.6);
headline('<b>No meeting.</b>', 50, 84, 53.9, 58.4);
function proposal(title, rows, x, y) {
  return add(`<div style="display:flex;align-items:center;gap:12px"><span class="pt" style="flex:1">${title}</span><span class="badges" style="position:relative;height:28px;width:260px"></span></div>` +
    rows.map((r) => `<div class="row" data-k="${r.k}"><span>${r.av}</span><span class="lab">${r.label}</span><span class="bar"><i class="${r.amber ? 'amber' : ''}"></i></span><span class="vv">${r.val}</span>${r.why ? `<span class="why">${r.why}</span>` : ''}</div>`).join(''),
    { left: x + 'px', top: y + 'px' }, 'card prop');
}
{
