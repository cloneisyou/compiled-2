<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clone Team Workspace — motion</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0c1322; --navy:#12306e; --blue:#1d8cf0; --muted:#8a8f98; --line:#e8eaee; --ok:#12a37f; --warn:#d98a00; }
  * { box-sizing: border-box; }

  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #f6f9fe 62%, #e9f1fd 100%); }
  #stage::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(#c9d8f2 1px, transparent 1.2px); background-size: 14px 14px; opacity: .55;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 110%, #000 0%, transparent 70%), radial-gradient(ellipse 40% 30% at 0% 0%, #000 0%, transparent 70%); -webkit-mask-composite: source-over; }
  #tint { position: absolute; inset: 0; background: linear-gradient(180deg, #eaf2ff, #dbe8fd); opacity: 0; }
  .abs { position: absolute; }
  .hl { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; color: var(--ink); white-space: nowrap; }
  .hl .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  .hl b { color: var(--blue); font-weight: 800; }
  .hl.navy { color: var(--navy); }
  .card { position: absolute; background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(20,50,110,.10); }
  .glow { box-shadow: 0 0 0 1.5px #8cc6fb, 0 0 0 6px rgba(29,140,240,.10), 0 18px 50px rgba(29,140,240,.18); }
  .av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; flex: none; position: relative; width: 44px; height: 44px; font-size: 18px; }
  .av.clone { background: #fff; color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
  .av.clone::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px dashed var(--c); opacity: .55; }
  .av.s { width: 26px; height: 26px; font-size: 12px; } .av.s.clone::after { inset: -3.5px; border-width: 1.5px; } .av.s.clone { box-shadow: inset 0 0 0 1.5px var(--c); }
  .av.l { width: 76px; height: 76px; font-size: 30px; }
  .livedot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #fff; }
  .cur { position: absolute; z-index: 20; }

  .comp { padding: 18px 20px 14px; }
  .comp .txt { font-size: 19px; min-height: 28px; line-height: 28px; white-space: nowrap; }
  .comp .txt .mention { color: var(--blue); font-weight: 500; }
  .comp .foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; color: #3c414a; }
  .comp .foot .sp { flex: 1; }
  .tog { width: 30px; height: 17px; border-radius: 999px; background: #d9dce1; position: relative; display: inline-block; }
  .tog i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .sendb { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--blue); vertical-align: -4px; margin-left: 1px; }
  .tabchip { display: inline-block; font-size: 11px; font-weight: 600; color: var(--blue); border: 1px solid #b8dcfb; border-radius: 6px; padding: 0 6px; margin-left: 10px; line-height: 18px; vertical-align: 2px; }
  .bubble { position: absolute; background: #f1f3f6; border-radius: 20px; padding: 12px 18px; font-size: 18px; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .who .note { font-weight: 400; color: var(--muted); font-size: 13.5px; }

  .pill.ok { color: var(--ok); background: #e3f6ef; } .pill.wait { color: var(--warn); background: #fdf2dc; } .pill.blue { color: var(--blue); background: #e6f2fe; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  .prop { padding: 22px 26px; width: 640px; }
  .prop .pt { font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
  .prop .row { display: grid; grid-template-columns: 26px 178px 1fr 86px; align-items: center; gap: 12px; margin-top: 14px; font-size: 15px; }
  .prop .bar { height: 7px; border-radius: 4px; background: #eef0f3; overflow: hidden; }
  .prop .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--ok); }
  .prop .bar i.amber { background: var(--warn); }
  .prop .vv { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  .btn { display: inline-block; font-weight: 600; font-size: 14.5px; border-radius: 10px; padding: 8px 18px; background: var(--ink); color: #fff; }
  .btn.g { background: #f1f3f6; color: var(--ink); }
  .key { position: absolute; bottom: 34px; width: 74px; height: 62px; border-radius: 12px; background: linear-gradient(180deg, #f3f9ff, #dcecfd); box-shadow: 0 0 0 1.5px #a9d2fb, 0 5px 0 #a9d2fb, 0 12px 22px rgba(29,140,240,.18); color: var(--blue); font-size: 13px; font-weight: 600; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .toast { position: absolute; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 18px; font-size: 15px; display: flex; gap: 10px; align-items: center; white-space: nowrap; box-shadow: 0 16px 40px rgba(12,19,34,.25); }
  .toast .av.clone { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; } .toast .av.clone::after { border-color: #fff; }
  .mini { width: 250px; padding: 14px 16px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .big { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -.05em; font-size: 190px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .big b { color: var(--blue); }
  .wm { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.03em; background: linear-gradient(90deg, #0c1322 10%, #1d6fd8 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chev { font-family: 'Plus Jakarta Sans'; font-weight: 800; letter-spacing: -.18em; background: linear-gradient(90deg, #0c1322, #1d8cf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; color: #5b6472; font-size: 21px; font-weight: 500; }
  .mascot { position: absolute; display: grid; grid-template-columns: repeat(13, 1fr); }
  .mascot i { aspect-ratio: 1; } .mascot i.b { background: var(--blue); } .mascot i.e { background: #0c1322; }
  .ring { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--ok); opacity: 0; }
</style>
</head>
<body>
<div id="stage"><div id="tint"></div></div>

const stage = document.getElementById('stage');

const loads = [];

headline('AI is <b>single-player.</b>', 232, 84, .35, 4.2);

// ───────── S2  4.5–8.2  Your team isn't.
headline('Your team <b>isn’t.</b>', 220, 96, 4.55, 8.1);
[['M', C.M, 330, 0], ['J', C.J, 602, 1], ['S', C.S, 874, 2]].forEach(([n, c, x, i]) => {
  const el = add(av(n, c, 'l'), { left: x + 'px', top: '400px' });
  show(el, 5.2 + i * .12, 8.0, 'pop', .5);

// ───────── S3  8.4–12.5  logo
{

  const y = add('Built for YC’s Request for Startups · Fall 2026 · <b style="color:#0c1322">Multiplayer AI</b>', { top: '640px', fontSize: '16px' }, 'sub'); show(y, 10.0, 12.4, 'fade', .6);
  const m = mascot(596, 520, 7); show(m, 9.9, 12.4, 'pop', .5);
  A(m, [{ translate: '0 0' }, { translate: '0 -22px' }, { translate: '0 0' }, { translate: '0 -12px' }, { translate: '0 0' }], 10.4, 1.3, { easing: 'ease-in-out' });
}
// ───────── S4  12.7–23  Everyone's in the room / even when away
headline('Everyone’s in <b>the room.</b>', 70, 64, 12.75, 17.6);
headline('Even when they’re <b>away.</b>', 70, 64, 17.9, 22.9);
{

    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px;color:#5b6472;font-size:15px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;border:2px solid var(--blue)"></span>In progress · one goal, one AI, the whole team</div>`,

headline('Pick <b>whose Clone</b> writes the next prompt.', 62, 52, 23.25, 35.4);
const JUN_PROMPT = 'Let\u2019s verify presence, cursors, shared thread, and prompt ownership end to end before launch.';
