<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clone Team Rooms — demo stage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e0f10; font-family: Inter, system-ui, sans-serif; }
    .screens { position: absolute; top: 24px; left: 24px; right: 24px; height: 900px; display: flex; gap: 24px; }
    .win { flex: none; position: relative; border-radius: 14px; overflow: hidden; background: #f7f7f5; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    .win .tag { position: absolute; z-index: 2; top: 10px; right: 12px; background: rgba(23,24,26,.85); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: none; }
    .win iframe { height: 804px; border: 0; transform: scale(1.12); transform-origin: 0 0; }
    #wmin { width: 1180px; } #wmin iframe { width: 1054px; }
    #wjun { width: 668px; } #wjun iframe { width: 597px; }
    .caption { position: absolute; left: 0; right: 0; bottom: 0; height: 156px; display: grid; place-items: center; color: #fff; font-size: 34px; font-weight: 600; letter-spacing: -.01em; text-align: center; padding: 0 120px; }
    .caption span { transition: opacity .35s; }
    .caption em { font-style: normal; color: #7fe0c0; }
    .card { position: absolute; inset: 0; background: #0e0f10; color: #fff; display: grid; place-items: center; text-align: center; opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 5; }
    .card.show { opacity: 1; }
    .card h1 { font-size: 76px; letter-spacing: -.03em; margin: 0 0 18px; font-weight: 700; }
    .card p { font-size: 32px; color: #a8abb0; margin: 0; }
    .card .logo { width: 72px; height: 72px; border-radius: 20px; background: #fff; color: #0e0f10; display: grid; place-items: center; font-size: 40px; font-weight: 700; margin: 0 auto 28px; }
    .card small { display: block; margin-top: 36px; font-size: 22px; color: #6f7378; }
  </style>
</head>
<body>
  <div class="screens">
    <div class="win" id="wmin"><iframe id="min" src="/?as=min"></iframe></div>
    <div class="win" id="wjun"><iframe id="jun" src="/?as=jun"></iframe></div>
  </div>
  <div class="caption"><span id="cap"></span></div>
  <div class="card" id="card"></div>
  <div id="ptr" style="position:absolute;z-index:4;left:960px;top:560px;width:26px;height:26px;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1);pointer-events:none">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l15 9.5-6.6 1.4L16 20l-2.8 1.3-3.6-7.2L4 18.5z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <script>
    window.pointTo = (x, y) => { const p = document.getElementById('ptr'); p.style.left = x + 'px'; p.style.top = y + 'px'; };
    window.caption = (html) => {
      const c = document.getElementById('cap');
      c.style.opacity = 0;
      setTimeout(() => { c.innerHTML = html; c.style.opacity = 1; }, 350);
    };
    window.card = (html) => {
      const c = document.getElementById('card');
      if (html) { c.innerHTML = html; c.classList.add('show'); } else c.classList.remove('show');
    };
  </script>
</body>
</html>
