<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Human Model Benchmark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: Inter, system-ui, sans-serif; color: #1b1c1e; -webkit-font-smoothing: antialiased; }
    .wrap { height: 100%; display: grid; place-items: center; }
    .card { width: 760px; }
    .ff { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1d8cf0; background: #e8f3fe; border-radius: 999px; padding: 4px 10px; margin-bottom: 14px; opacity: 0; animation: up .5s .1s forwards; }
    h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; opacity: 0; animation: up .5s .2s forwards; }
    .sub { color: #8a8d93; margin: 4px 0 22px; opacity: 0; animation: up .5s .3s forwards; }
    .row { display: grid; grid-template-columns: 1fr 70px; align-items: center; gap: 16px; margin: 9px 0; opacity: 0; animation: up .45s forwards; }
    .bar { height: 30px; border-radius: 7px; background: #f1f1f0; position: relative; overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: #e6e6e4; border-radius: 7px; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .bar span { position: relative; z-index: 1; line-height: 30px; padding-left: 10px; font-size: 14px; }
    .bar span b { font-weight: 700; margin-right: 4px; }
    .lead .bar i { background: linear-gradient(90deg, #1d8cf0, #2aa3ff); box-shadow: 0 6px 20px rgba(29,140,240,.3); }
    .lead .bar span { color: #fff; }
    .v { font-variant-numeric: tabular-nums; text-align: right; color: #55585e; }
    .lead .v { color: #1d8cf0; font-weight: 700; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { width: var(--w); } }
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <div class="ff">Fun fact</div>
    <h1>Human Model Benchmark</h1>
    <div class="sub">DataClaw · 1,257 samples · Prediction accuracy</div>
    <div id="rows"></div>
  </div></div>
  <script>
    const data = [
      ['Clone', 'Clone-0', 93.9], ['OpenAI', 'GPT-6 Astra', 88.5], ['Anthropic', 'Claude Opus 5.5', 63.2],
      ['CMU', 'OdySim 8B', 26.6], ['Stanford', 'HumanLM 8B', 22.0], ['Microsoft', 'UserLM 8B', 7.5],
    ];
    document.getElementById('rows').innerHTML = data.map(([lab, model, v], i) =>
      `<div class="row ${i === 0 ? 'lead' : ''}" style="animation-delay:${0.45 + i * 0.12}s"><div class="bar"><i style="--w:${v}%;animation-delay:${0.5 + i * 0.12}s"></i><span><b>${lab}</b>${model}</span></div><div class="v">${v.toFixed(1)}%</div></div>`).join('');
  </script>
</body>
</html>
